packages:
  - 'frontend'
  - 'backend'

# 共享依赖配置
shared-workspace-lockfile: true
link-workspace-packages: true
prefer-workspace-packages: true

# 依赖提升配置
hoist-pattern:
  - '@types/*'
  - 'eslint*'
  - 'prettier*'
  - 'typescript'

# 忽略模式
ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'